name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Releases run one at a time in merge order; a newer push never cancels a rollout.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: claimwise-sg
  REGION: asia-southeast1
  SERVICE: claimwise-sg
  WORKLOAD_IDENTITY_PROVIDER: projects/721110976915/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER_SERVICE_ACCOUNT: github-deployer@claimwise-sg.iam.gserviceaccount.com

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Runtime configuration (environment, secrets, scaling) is owned by Terraform;
      # this step only builds and rolls out the new code.
      - name: Deploy
        run: >-
          gcloud run deploy "$SERVICE" --source . --project "$PROJECT_ID"
          --region "$REGION" --quiet

      - name: Smoke test
        run: scripts/deploy.sh verify
